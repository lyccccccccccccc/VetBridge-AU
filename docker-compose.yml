services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vetbridge
      POSTGRES_PASSWORD: vetbridge
      POSTGRES_DB: vetbridge
    ports:
      - "5432:5432"
    volumes:
      - vetbridge_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetbridge"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vetbridge_postgres:
